spring.application.name=responses-spring-ai-boot
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
server.shutdown=graceful

spring.ai.model.chat=openai
spring.ai.openai.chat.api=responses
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.responses.model=gpt-4o-mini
spring.ai.openai.responses.temperature=0.0
